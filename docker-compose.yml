version: '3.9'

services:
  mongo:
    image: mongo:6.0
    container_name: online-learning-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: online-learning-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://root:example@mongo:27017/online-learning-platform?authSource=admin
    ports:
      - '5000:5000'
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: online-learning-frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://backend:5000
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  mongo_data:
