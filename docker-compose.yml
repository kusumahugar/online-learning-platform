version: '3.9'
services:
  mongo:
    image: mongo:6.0
    container_name: online-learning-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: online-learning-backend
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/online-learning-platform
      JWT_SECRET: supersecretkey

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://backend:5000
    container_name: online-learning-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://backend:5000

volumes:
  mongo-data:
